name: checks

# The checks run as parallel jobs; "terraform", the check the main branch's
# ruleset requires, passes only when all of them pass. bin/check-modules with no
# options still runs everything in one go locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache

jobs:
  modules:
    name: modules (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          tflint: "true"
      - name: validate, tflint, test
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset
        run: bin/check-modules --part modules --shard ${{ matrix.shard }}/3

  cli:
    name: bin/ scripts (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: bin/ script tests
        run: bin/check-modules --part cli --shard ${{ matrix.shard }}/6

  repo:
    name: fmt, templates, plugin, checkov, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          checkov: "true"
      - name: fmt, templates, plugin, checkov
        run: bin/check-modules --part fmt --part templates --part plugin --part checkov
      - name: Module READMEs match terraform-docs
        if: success() || failure()
        run: |
          for m in modules/*/; do m=$(basename "$m");
            terraform-docs -c .terraform-docs.yml --output-check "modules/$m"
          done
      - name: README pins the newest release
        if: success() || failure()
        run: bin/check-readme-pins

  compat:
    name: upgrade plans no changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # bin/check-compat plans against an older tag
      - uses: ./.github/actions/setup
      - name: Upgrading from v1.2.0 plans no changes (offline)
        run: bin/check-compat v1.2.0

  terraform:
    needs: [modules, cli, repo, compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
