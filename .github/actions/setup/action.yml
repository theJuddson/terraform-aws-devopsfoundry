name: setup
description: Terraform, and optionally tflint, checkov and terraform-docs, for bin/check-modules and the other checks.

inputs:
  tflint:
    description: Install tflint.
    default: "false"
  checkov:
    description: Install Python, checkov and terraform-docs.
    default: "false"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "1.14.7"
        terraform_wrapper: false

    - if: inputs.tflint == 'true'
      uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      with:
        tflint_version: v0.65.0

    - if: inputs.checkov == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - if: inputs.checkov == 'true'
      name: Install checkov and terraform-docs
      shell: bash
      run: |
        pip install --quiet checkov==3.4.3
        # GitHub release downloads sometimes return 5xx; --fail keeps an error
        # page from being saved as the tarball, and the checksum pins the file.
        curl -sSfL --retry 5 --retry-all-errors --retry-delay 10 -o /tmp/terraform-docs.tgz \
          https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
        echo "9005daf969de0b50134493a2c00078b49f5f5b39d021cda7c89bf4d4f3d776d3  /tmp/terraform-docs.tgz" | sha256sum -c -
        tar -xzf /tmp/terraform-docs.tgz -C /usr/local/bin terraform-docs

    - name: Cache providers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .plugin-cache
          ~/.tflint.d/plugins
        key: tf-${{ hashFiles('**/versions.tf', '**/main.tf', '.tflint.hcl') }}
        restore-keys: tf-

    - shell: bash
      run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
